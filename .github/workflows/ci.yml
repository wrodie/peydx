name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peydx
          POSTGRES_PASSWORD: peydx
          POSTGRES_DB: peydx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peydx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:ci
        env:
          DATABASE_URI: postgres://peydx:peydx@localhost:5432/peydx_test
          PAYLOAD_SECRET: ci-payload-secret-placeholder-not-real

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/signage-core/coverage
            apps/server/coverage
            apps/player/coverage
            sync/coverage
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build:all
